[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplemem"
version = "0.3.0"
description = "Efficient Lifelong Memory for LLM Agents — unified text + multimodal."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "SimpleMem Team" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Text path core
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "lancedb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "dateparser>=1.1.0",
    "pyarrow>=12.0.0",
    "tantivy>=0.20.0",
    "rank_bm25>=0.2.2",
    "tqdm>=4.60.0",
    # Multimodal
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "Pillow>=9.0.0",
    "open_clip_torch>=2.20.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "httpx",
]

[project.optional-dependencies]
server = [
    "mcp>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.15.0",
]
benchmark = [
    "datasets>=2.0.0",
    "bert-score>=0.3.0",
    "rouge-score>=0.1.0",
    "nltk>=3.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
]
# GPU wheels for Linux/NVIDIA — install with: uv sync --extra gpu
gpu = [
    "torch==2.8.0",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-curand-cu12==10.3.9.90",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-nvjitlink-cu12==12.8.93",
    "triton==3.4.0",
]
all = ["simplemem[server,benchmark,dev]"]

[project.urls]
Repository = "https://github.com/huaxiuyao/simplemem-refactor"

[tool.setuptools.packages.find]
include = ["simplemem", "simplemem.*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "EvolveMem/",
    "OmniSimpleMem/",
    ".venv/",
]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle errors; F: pyflakes; I: isort; W: pycodestyle warnings
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = [
    "E501",   # line too long — not enforced; long lines are common in ML/research code
]

[tool.ruff.lint.per-file-ignores]
# sys.path.insert at top of test files is intentional — not a real import-order issue
"*/tests/**" = ["E402"]
